<body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<div id="ui"><button id="pp">▶ Reproducir</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">0.0 s</span></div>
<script>
// ============================================================
//  PERSONALIZA AQUÍ
// ============================================================
const CONFIG = {
  nombre: "",          // su nombre, p. ej. "Lucía". Vacío = "mi amor"
  dias: 30,            // días que lleváis juntos (28–31)
  firma: "",           // opcional: tu nombre al final, p. ej. "Pepe"
  fecha: "",           // opcional: p. ej. "17 · 10 · 2026" (el día que empezasteis)
};
// ============================================================
//  BEAT SHEET  (72 BPM, 1 compás = 3.333 s, 8 compases = 26.67 s)
//  0.0   spark appears in the dark, heartbeats (lub-dub)        | pad swell, heartbeat thumps
//  1.0   "Hace un mes…" letters fade in                          |
//  2.9   spark glides to the left edge                           | soft whoosh
//  3.5   spark draws a heartbeat line that becomes a heart       | music-box arpeggios begin
//  5.0   "y mi corazón / empezó a latir distinto"                |
//  8.33  heart closes, fills with glow and beats                 | heartbeat + bell
//  8.9   heart shrinks to an icon; day counter 1→N, grid of hearts pops one by one | rising celesta ticks
//  12.2  "720 horas · 43.200 minutos"                            | arps return
//  13.6  "y no cambiaría ni uno solo"                            |
//  15.0  the little hearts dissolve into sparks → two lights "tú" & "yo" | airy shimmer
//  15.6  "dos caminos…" / "…que se encontraron"                  |
//  16.3–20 the two lights orbit closer and closer                | rising swell
//  20.0  they meet: flash, a big heart blooms, burst of sparkles | boom + bell chord (downbeat)
//  21.6  "Feliz" / "primer mes" (script wipe) / "mi amor"        | melody
//  24.2  "te quiero ♥"                                            |
//  26.0  gentle fade to dark                                     | final chord rings out
// ============================================================

const W = 1080, H = 1920, DUR = 8 * 4 * 60 / 72; // 26.667
const BEAT = 60 / 72;
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
if (RENDER) document.documentElement.classList.add('render');

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
// fade window: 0 before a, 1 between a+fi and b, 0 after b+fo
const win = (t, a, fi, b, fo) => Math.min(seg(t, a, a + fi), 1 - seg(t, b, b + fo));
// heartbeat pulse (lub-dub) at time tb
const pulse = (t, tb) => { const a = t - tb, b = t - tb - 0.2; return (a > 0 ? Math.exp(-a * 9) * Math.sin(Math.min(a * 18, Math.PI / 2)) : 0) + 0.6 * (b > 0 ? Math.exp(-b * 9) * Math.sin(Math.min(b * 18, Math.PI / 2)) : 0); };

const NOMBRE = CONFIG.nombre.trim() || 'mi amor';
const DIAS = Math.max(1, Math.min(31, CONFIG.dias | 0));
const fmt = n => n.toLocaleString('es-ES').replace(/,/g, '.').replace(/ |\s/g, '.');
const HORAS = fmt(DIAS * 24), MINUTOS = fmt(DIAS * 1440);

// ---------- palette ----------
const C = {
  bg0: '#2a0a19', bg1: '#07030a',
  rose: '#ff5c8a', pink: '#ffb3c7', blush: '#ffd9e3', gold: '#ffd9a0', text: '#fff1f4', dim: '#d99aae',
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// ---------- heart geometry ----------
// unit heart: classic parametric, t in [0, 2π], t=0 at the top cusp, t=π at the bottom tip
function heartXY(t) {
  const s = Math.sin(t);
  return [16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
}
const HEART_UNIT = new Path2D();
for (let i = 0; i <= 200; i++) { const [x, y] = heartXY(i / 200 * Math.PI * 2); i ? HEART_UNIT.lineTo(x, y) : HEART_UNIT.moveTo(x, y); }
HEART_UNIT.closePath();
// heart with its visual centre at (cx, cy), width ≈ 32*s
function heartPath(c, cx, cy, s) {
  c.save(); c.translate(cx, cy - 2.5 * s); c.scale(s, s);
}

// ---------- sprites (drawn once) ----------
function makeGlow(size, stops) {
  const g = document.createElement('canvas'); g.width = g.height = size;
  const x = g.getContext('2d'), gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  x.fillStyle = gr; x.fillRect(0, 0, size, size); return g;
}
const GLOW = makeGlow(256, [[0, 'rgba(255,255,255,1)'], [0.12, 'rgba(255,220,230,.9)'], [0.35, 'rgba(255,92,138,.35)'], [1, 'rgba(255,92,138,0)']]);
const SOFT = makeGlow(256, [[0, 'rgba(255,140,175,.55)'], [0.5, 'rgba(255,92,138,.18)'], [1, 'rgba(255,92,138,0)']]);
const BOKEH = makeGlow(128, [[0, 'rgba(255,190,210,.5)'], [0.7, 'rgba(255,150,180,.25)'], [1, 'rgba(255,150,180,0)']]);
// background: deep wine radial + vignette
const BG = (() => {
  const g = document.createElement('canvas'); g.width = W; g.height = H;
  const x = g.getContext('2d');
  x.fillStyle = C.bg1; x.fillRect(0, 0, W, H);
  let gr = x.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, H * 0.75);
  gr.addColorStop(0, '#3a0f22'); gr.addColorStop(0.45, '#1c0612'); gr.addColorStop(1, '#07030a');
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
  return g;
})();
// film grain tiles
const GRAIN = Array.from({ length: 6 }, (_, k) => {
  const g = document.createElement('canvas'); g.width = 540; g.height = 960;
  const x = g.getContext('2d'), d = x.createImageData(540, 960), r = rng(100 + k);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return g;
});

function glow(img, x, y, size, alpha = 1) {
  if (alpha <= 0.002 || size <= 0) return;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
  ctx.globalAlpha = 1;
}

// ---------- text ----------
const F_SERIF = "'Corm', 'Cormorant Garamond', Georgia, serif";
const F_SCRIPT = "'Vibes', 'Great Vibes', cursive";
// words rise and un-blur one by one. opts: {size, weight, italic, color, stagger, font, out:[t, dur]}
function words(text, x, y, t, t0, o = {}) {
  const size = o.size || 64, font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || F_SERIF}`;
  ctx.font = font; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const ws = text.split(' '), sp = ctx.measureText(' ').width, wd = ws.map(w => ctx.measureText(w).width);
  const total = wd.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = x - total / 2;
  const outA = o.out ? 1 - seg(t, o.out[0], o.out[0] + o.out[1]) : 1;
  ws.forEach((w, i) => {
    const ti = t0 + i * (o.stagger ?? 0.13), k = spring(t - ti, 9, 1);
    const a = clamp((t - ti) / 0.45) * outA;
    if (a > 0.002) {
      ctx.globalAlpha = a; ctx.fillStyle = o.color || C.text;
      ctx.fillText(w, cx, y + (1 - k) * 26 - (o.out ? easeIn(seg(t, o.out[0], o.out[0] + o.out[1])) * 14 : 0));
    }
    cx += wd[i] + sp;
  });
  ctx.globalAlpha = 1;
}
// letters fade in one by one
function letters(text, x, y, t, t0, per, o = {}) {
  const size = o.size || 80; ctx.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${o.font || F_SERIF}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const total = ctx.measureText(text).width; let cx = x - total / 2;
  const outA = o.out ? 1 - seg(t, o.out[0], o.out[0] + o.out[1]) : 1;
  [...text].forEach((ch, i) => {
    const a = clamp((t - t0 - i * per) / 0.5) * outA;
    if (a > 0.002) { ctx.globalAlpha = a; ctx.fillStyle = o.color || C.text; ctx.fillText(ch, cx, y + (1 - easeOut(clamp((t - t0 - i * per) / 0.6))) * 10); }
    cx += ctx.measureText(ch).width;
  });
  ctx.globalAlpha = 1;
}

// ---------- glowing line ----------
function strokeGlow(pts, from, to, alpha = 1, widths = [26, 11, 3.2]) {
  if (to - from < 2 || alpha <= 0.002) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const layers = [[widths[0], 'rgba(255,92,138,0.10)'], [widths[1], 'rgba(255,120,160,0.28)'], [widths[2], 'rgba(255,235,240,0.95)']];
  ctx.beginPath(); ctx.moveTo(pts[from][0], pts[from][1]);
  for (let i = from + 1; i <= to; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.globalAlpha = alpha;
  for (const [w, col] of layers) { ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke(); }
  ctx.restore();
}

// ---------- scene 2: heartbeat line that becomes a heart ----------
const BIG = { cx: 540, cy: 820, s: 21 };
const TIP_Y = BIG.cy - 2.5 * BIG.s + 17 * BIG.s;   // bottom tip in canvas y: the line runs along it like a horizon
const LINE = (() => {
  const pts = []; const step = 3;
  const push = (x, y) => pts.push([x, y]);
  const y0 = TIP_Y, xs = 70;
  // flat → small P bump → QRS spike → flat to the cusp
  const ecg = x => {
    const u = (x - 150) / 160; // spike region 150..310
    if (u < 0 || u > 1) return 0;
    if (u < 0.25) return -18 * Math.sin(u / 0.25 * Math.PI);            // P wave
    if (u < 0.40) return 0;

  const chords = [[53, 57, 60, 64], [50, 53, 57, 60], [46, 50, 53, 57], [48, 52, 55, 60], [50, 53, 57, 62], [46, 50, 53, 58], [53, 57, 60, 65], [46, 50, 53, 58]];
  const roots = [41, 38, 34, 36, 38, 34, 41, 34];

  // pad: detuned saws, slow attack, low-pass
  function pad(notes, t0, dur, vol) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 950; f.Q.value = 0.4;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 1.1); g.gain.setValueAtTime(vol, t0 + dur - 0.2); g.gain.linearRampToValueAtTime(0, t0 + dur + 1.4);
    f.connect(g); g.connect(padBus);
    notes.forEach(n => [-7, 7].forEach(det => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(n); o.detune.value = det; const og = ac.createGain(); og.gain.value = 0.05; o.connect(og); og.connect(f); o.start(t0); o.stop(t0 + dur + 1.6); }));
  }
  // music box / celesta note
  function bell(m, t0, vol = 0.12, len = 2.2) {
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, t0 + len);
    g.connect(boxBus);
    [[1, 1], [2, 0.35], [3.01, 0.12], [4.2, 0.06]].forEach(([h, a]) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m) * h;
      const og = ac.createGain(); og.gain.setValueAtTime(a, t0); og.gain.exponentialRampToValueAtTime(0.0005, t0 + len / (h * 0.9));
      o.connect(og); og.connect(g); o.start(t0); o.stop(t0 + len + 0.1);
    });
  }
  // soft piano-ish bass
  function bass(m, t0, dur, vol = 0.22) {
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(lowBus); o.start(t0); o.stop(t0 + dur + 0.1);
  }
  // heartbeat thump
  function thump(t0, vol = 0.9) {
    [[0, vol], [0.2, vol * 0.6]].forEach(([d, v]) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(78, t0 + d); o.frequency.exponentialRampToValueAtTime(38, t0 + d + 0.22);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(v, t0 + d + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t0 + d + 0.32);
      o.connect(g); g.connect(lowBus); o.start(t0 + d); o.stop(t0 + d + 0.4);
    });
  }
  // filtered noise swell (whoosh / shimmer)
  const nbuf = ac.createBuffer(1, sr * 6, sr); { const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  function noise(t0, dur, f0, f1, vol, shape = 'swell') {
    const s = ac.createBufferSource(); s.buffer = nbuf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = ac.createGain();
    if (shape === 'swell') { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.6); }
    else { g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + dur * 0.4); g.gain.linearRampToValueAtTime(0, t0 + dur); }
    s.connect(f); f.connect(g); g.connect(fxBus); s.start(t0); s.stop(t0 + dur + 0.7);
  }

  // --- arrangement ---
  chords.forEach((ch, b) => pad(b === 7 ? ch : ch, b * BAR, BAR, b === 0 ? 0.6 : b === 6 ? 1.0 : 0.8));
  pad([53, 57, 60, 65], 7.5 * BAR, BAR * 0.5 + 0.6, 0.9);                  // last half bar → F
  roots.forEach((r, b) => { if (b >= 1) { bass(r, b * BAR, BAR * 0.9); bass(r, b * BAR + 2.5 * BEAT, BEAT * 1.4, 0.12); } });
  bass(41, 7.5 * BAR, 3.5, 0.2);
  // heartbeats
  [0.85, 0.85 + BEAT, 0.85 + 2 * BEAT].forEach(t => thump(t, 0.8));
  [8.33, 8.33 + BEAT].forEach(t => thump(t, 0.55));
  // spark glide whoosh
  noise(2.85, 0.7, 500, 2400, 0.025, 'hump');
  // arpeggios (8th notes) bars 1–2 and bars 3.6–5
  const arp = [0, 1, 2, 3, 2, 1, 2, 3];
  for (let i = 0; i < 64; i++) {
    const t = BAR + i * BEAT / 2, b = Math.floor(t / BAR);
    if (b > 5) break;
    if (t > GRID_T0 - 0.3 && t < GRID_END + 0.4) continue;   // grid ticks take over
    if (t > 15.0 && t < ORB0) continue;
    const ch = chords[b]; const n = ch[arp[i % 8]] + 24;
    bell(n, t, (i % 2 ? 0.05 : 0.075) * (b === 1 ? 0.8 : 1), 1.8);
  }
  // heart closes: bell
  bell(77, 8.33, 0.11, 3); bell(72, 8.33, 0.07, 3);
  // grid ticks: pentatonic ascent
  const penta = [0, 2, 4, 7, 9];
  for (let i = 0; i < DIAS; i++) { const m = 72 + 12 * Math.floor(i / 5) / 2 + penta[i % 5]; bell(Math.min(m, 100) | 0, gridT(i), 0.045 + 0.02 * (i / DIAS), 0.9); }
  bell(89, GRID_END + 0.1, 0.08, 2.5); bell(84, GRID_END + 0.1, 0.06, 2.5);
  // scene 4 airy shimmer + rising swell into the meet
  noise(15.0, 1.4, 3000, 7000, 0.015, 'hump');
  noise(ORB0, MEET - ORB0, 300, 4000, 0.06, 'swell');
  for (let i = 0; i < 14; i++) { const t = ORB0 + (MEET - ORB0) * (1 - Math.pow(1 - i / 14, 1.6)); bell(84 + penta[i % 5] + (i > 7 ? 12 : 0), t, 0.03, 0.8); }
  // the meet: boom + bloom chord + sparkles
  { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(90, MEET); o.frequency.exponentialRampToValueAtTime(32, MEET + 1.2);
    const g = ac.createGain(); g.gain.setValueAtTime(0, MEET); g.gain.linearRampToValueAtTime(0.8, MEET + 0.015); g.gain.exponentialRampToValueAtTime(0.001, MEET + 1.6);
    o.connect(g); g.connect(lowBus); o.start(MEET); o.stop(MEET + 1.7); }
  [65, 69, 72, 77, 81].forEach((m, i) => bell(m, MEET + i * 0.012, 0.07, 4));
  for (let i = 0; i < 18; i++) bell(96 + penta[Math.floor(R() * 5)] - 12 * (R() < 0.4), MEET + 0.05 + R() * 1.6, 0.02 + R() * 0.02, 0.7);
  // melody (bars 6–7): over the final card
  const mel = [[6, 0, 72, 1.5], [6, 1.5, 69, 0.5], [6, 2, 72, 1], [6, 3, 77, 1], [7, 0, 74, 1.5], [7, 1.5, 72, 0.5], [7, 2, 70, 0.5], [7, 2.5, 69, 0.5], [7, 3, 65, 2]];
  mel.forEach(([b, beat, m]) => bell(m + 12, b * BAR + beat * BEAT + 1.67, 0.1, 2.6));
  // soft arps under the final card
  for (let i = 0; i < 16; i++) { const t = 6 * BAR + BEAT * 2 + i * BEAT / 2; if (t > DUR - 1.2) break; const b = Math.floor(t / BAR); bell(chords[b][arp[i % 8]] + 12, t, 0.035, 1.5); }
  // final heart
  thump(24.8, 0.3);
  bell(77, DUR - 1.0, 0.05, 3);
}

// ============================================================
//  boot: fonts first, then expose the contract
// ============================================================
(async () => {
  try { await Promise.all(["400 80px Corm", "italic 400 80px Corm", "300 80px Corm", "500 80px Corm", "400 80px Vibes"].map(f => document.fonts.load(f))); } catch (e) {}
  await document.fonts.ready;
  window.VIDEO = { w: W, h: H, duration: DUR };
  window.seek = seek;
  window.buildAudio = buildAudio;
  seek(RENDER ? 0 : 0.0);
  if (RENDER) return;
  // preview: fit to window, play with sound
  const stage = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 60) / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px, 0) scale(${k})`; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tc = document.getElementById('tc');
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { pp.textContent = '…'; const off = new OfflineAudioContext(2, Math.ceil(48000 * (DUR + 2)), 48000); await buildAudio(off); buf = await off.startRendering(); }
    if (offset >= DUR - 0.05) offset = 0;
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset); startAt = ac.currentTime; playing = true; pp.textContent = '❚❚ Pausa';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = '▶ Reproducir'; }
  const now = () => playing ? offset + ac.currentTime - startAt : offset;
  pp.onclick = () => playing ? pause() : play();
  sc.oninput = () => { const was = playing; pause(); offset = sc.value / 1000 * DUR; if (was) play(); };
  (function loop() {
    let t = now(); if (playing && t >= DUR) { pause(); offset = DUR - 0.001; t = offset; }
    seek(t); sc.value = Math.round(t / DUR * 1000); tc.textContent = t.toFixed(1) + ' s';
    requestAnimationFrame(loop);
  })();
})();
</script>
